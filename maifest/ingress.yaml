apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress
  namespace: demo
  annotations:
    # Specifies that the ALB should be public-facing
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Tells AWS to route traffic directly to pod IPs (EKS best practice)
    alb.ingress.kubernetes.io/target-type: ip
    # Explicitly defines your VPC ID to prevent auto-discovery errors
    alb.ingress.kubernetes.io/vpc-id: vpc-00270fe29012f81bf
    # Explicitly defines your public subnet IDs
    alb.ingress.kubernetes.io/subnets: subnet-00a98dd365548c31, subnet-0cc42434c0ef1298f
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-service
                port:
                  number: 80
